<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传感器数据包生成器 (电赛调试专用)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        input[type="number"] { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-6">
            <h1 class="text-2xl font-bold">📡 传感器遥测帧生成器 (SensorTelemetryFrame)</h1>
            <p class="text-blue-100 mt-2 text-sm">专为电赛上位机调试设计 | 48 Bytes | Little-Endian | CRC16-CCITT</p>
        </div>

        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left Column: Inputs -->
            <div class="space-y-6">
                <!-- Upper Arm -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">大臂 IMU 四元数 (Upper Arm)</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs text-gray-500 mb-1">w</label><input type="number" id="u_w" value="1.0" step="0.01" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200"></div>
                        <div><label class="block text-xs text-gray-500 mb-1">x</label><input type="number" id="u_x" value="0.0" step="0.01" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200"></div>
                        <div><label class="block text-xs text-gray-500 mb-1">y</label><input type="number" id="u_y" value="0.0" step="0.01" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200"></div>
                        <div><label class="block text-xs text-gray-500 mb-1">z</label><input type="number" id="u_z" value="0.0" step="0.01" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200"></div>
                    </div>
                </div>

                <!-- Lower Arm -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">小臂 IMU 四元数 (Lower Arm)</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs text-gray-500 mb-1">w</label><input type="number" id="l_w" value="1.0" step="0.01" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200"></div>
                        <div><label class="block text-xs text-gray-500 mb-1">x</label><input type="number" id="l_x" value="0.0" step="0.01" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200"></div>
                        <div><label class="block text-xs text-gray-500 mb-1">y</label><input type="number" id="l_y" value="0.0" step="0.01" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200"></div>
                        <div><label class="block text-xs text-gray-500 mb-1">z</label><input type="number" id="l_z" value="0.0" step="0.01" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200"></div>
                    </div>
                </div>

                <!-- EMG Grip & Extras -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">肌电开合强度及其他 (EMG & Ext)</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">肌电开合 (0..100)</label>
                            <input type="number" id="emg" value="0" min="0" max="100" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">传感器状态位 (Hex)</label>
                            <input type="text" id="flags" value="0x00" class="w-full px-3 py-2 border rounded focus:ring focus:ring-blue-200">
                        </div>
                    </div>
                </div>

                <button onclick="generatePacket()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition-colors shadow-md">
                    ⚡ 生成完整数据包 (Generate)
                </button>
            </div>

            <!-- Right Column: Outputs -->
            <div class="flex flex-col space-y-4">
                <div class="flex-1 bg-gray-900 rounded-lg p-4 shadow-inner text-gray-100 flex flex-col relative">
                    <h3 class="text-sm font-semibold text-gray-400 mb-2 uppercase tracking-wider">Hex 格式 (十六进制流)</h3>
                    <button onclick="copyText('hexOutput')" class="absolute top-3 right-3 text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-white">复制</button>
                    <textarea id="hexOutput" readonly class="w-full flex-1 bg-transparent border-none resize-none font-mono text-sm focus:ring-0 p-0 text-green-400" spellcheck="false"></textarea>
                </div>

                <div class="flex-1 bg-gray-900 rounded-lg p-4 shadow-inner text-gray-100 flex flex-col relative">
                    <h3 class="text-sm font-semibold text-gray-400 mb-2 uppercase tracking-wider">C 语言测试数组 (供上位机 mock 测试)</h3>
                    <button onclick="copyText('cOutput')" class="absolute top-3 right-3 text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-white">复制</button>
                    <textarea id="cOutput" readonly class="w-full flex-1 bg-transparent border-none resize-none font-mono text-sm focus:ring-0 p-0 text-blue-300" spellcheck="false"></textarea>
                </div>
                
                <div class="bg-blue-50 text-blue-800 text-sm p-3 rounded border border-blue-200">
                    <p><strong>💡 提示：</strong> Seq 序列号和 Timestamp 时间戳在每次点击生成时会自动递增/更新。CRC16 会自动覆盖前46字节计算。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sequenceNumber = 0;

        // CRC16-CCITT 算法 (Poly: 0x1021, Init: 0xFFFF)
        function calculateCrc16(buffer, length) {
            let crc = 0xFFFF;
            const view = new Uint8Array(buffer);
            for (let i = 0; i < length; i++) {
                crc ^= (view[i] << 8);
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) {
                        crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                    } else {
                        crc = (crc << 1) & 0xFFFF;
                    }
                }
            }
            return crc;
        }

        function generatePacket() {
            // 建立 48 字节长度的 Buffer
            const buffer = new ArrayBuffer(48);
            const view = new DataView(buffer);

            // 读取输入
            const getFloat = (id) => parseFloat(document.getElementById(id).value) || 0;
            const emgGrip = parseInt(document.getElementById('emg').value) || 0;
            const flags = parseInt(document.getElementById('flags').value, 16) || 0;

            // 限制 EMG 范围
            const safeEmg = Math.max(0, Math.min(100, emgGrip));

            // 1. 组装帧头和基础信息 (全部采用小端序 true)
            view.setUint8(0, 0xA5);                     // SOF1
            view.setUint8(1, 0x5A);                     // SOF2
            view.setUint8(2, 0x01);                     // Ver
            view.setUint8(3, 0x01);                     // Type
            view.setUint16(4, sequenceNumber, true);    // Seq
            
            // 使用当前时间的毫秒数作为 timestamp
            const timestamp = Date.now() % 0xFFFFFFFF;
            view.setUint32(6, timestamp, true);         // Timestamp_ms

            // 2. 大臂四元数 w, x, y, z (Float32, Little Endian)
            view.setFloat32(10, getFloat('u_w'), true);
            view.setFloat32(14, getFloat('u_x'), true);
            view.setFloat32(18, getFloat('u_y'), true);
            view.setFloat32(22, getFloat('u_z'), true);

            // 3. 小臂四元数 w, x, y, z (Float32, Little Endian)
            view.setFloat32(26, getFloat('l_w'), true);
            view.setFloat32(30, getFloat('l_x'), true);
            view.setFloat32(34, getFloat('l_y'), true);
            view.setFloat32(38, getFloat('l_z'), true);

            // 4. 肌电、标志位和保留位
            view.setUint8(42, safeEmg);                 // emg_grip (0-100)
            view.setUint8(43, flags);                   // sensor_flags
            view.setUint16(44, 0, true);                // reserved

            // 5. 计算 CRC (针对前 46 字节)
            const crc = calculateCrc16(buffer, 46);
            view.setUint16(46, crc, true);              // CRC16_CCITT (Little Endian)

            // 格式化输出
            const uint8Array = new Uint8Array(buffer);
            let hexString = "";
            let cArrayString = "const uint8_t mock_frame[48] = {\n    ";
            
            for (let i = 0; i < uint8Array.length; i++) {
                let hex = uint8Array[i].toString(16).toUpperCase().padStart(2, '0');
                hexString += hex + " ";
                
                cArrayString += "0x" + hex + ", ";
                if ((i + 1) % 8 === 0 && i !== uint8Array.length - 1) {
                    cArrayString += "\n    ";
                }
            }
            cArrayString += "\n};";

            document.getElementById('hexOutput').value = hexString.trim();
            document.getElementById('cOutput').value = cArrayString;

            // 序列号自增
            sequenceNumber = (sequenceNumber + 1) & 0xFFFF;
        }

        function copyText(elementId) {
            const copyText = document.getElementById(elementId);
            copyText.select();
            document.execCommand("copy");
            
            // 简单的复制成功反馈
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "已复制!";
            btn.classList.replace("bg-gray-700", "bg-green-600");
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace("bg-green-600", "bg-gray-700");
            }, 1500);
        }

        // 页面加载时自动生成一次
        window.onload = generatePacket;
    </script>
</body>
</html>
